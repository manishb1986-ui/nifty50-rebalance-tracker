name: Telegram bot commands

on:
  schedule:
    # every 30 min at :07 and :37 UTC, 07:37-22:07 IST (off-peak minutes)
    - cron: "7,37 2-16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: nifty50-data
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Answer Telegram commands
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m nifty50_tracker.telegram_bot
      - name: Commit results (only if /run changed data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: Nifty 50 tracker (Telegram /run) $(date -u +%F)"
          git pull --rebase --autostash && git push
