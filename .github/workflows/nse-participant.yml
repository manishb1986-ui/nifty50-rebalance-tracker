name: NSE participant OI download

on:
schedule:
    # off-peak minutes; NSE publishes ~19:00-23:00 IST
    - cron: "23 14 * * 1-5"   # 19:53 IST, Mon-Fri
    - cron: "23 17 * * 1-5"   # 22:53 IST, Mon-Fri
    - cron: "11 1 * * 2-6"    # 06:41 IST next morning, Tue-Sat
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nifty50-data
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download participant files
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m nifty50_tracker nse-participant
      - name: Commit new files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nse
          if git diff --cached --quiet; then echo "no new NSE file yet"; exit 0; fi
          git commit -m "data: NSE participant files $(date -u +%F)"
          git pull --rebase --autostash && git push
